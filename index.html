<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>사이클 트래커</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사이클">
<meta name="theme-color" content="#0f0f0f">
<link rel="apple-touch-icon" id="ati">
<link rel="icon" id="fav" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=347bd67b719b732a6fc990157f14c71c"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;--p1:#111;--p2:#1a1a1a;--p3:#222;
  --acc:#b8ff00;--acc2:rgba(184,255,0,.1);--acc3:rgba(184,255,0,.28);
  --txt:#f0f0f0;--dim:#6e6e6e;--mute:#2e2e2e;--bd:#1e1e1e;
  --red:#ff4f4f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;overflow:hidden;color:var(--txt);}
#app{position:fixed;inset:0;}

/* MAP */
#map{position:absolute;inset:0;z-index:1;}

/* TOP BAR */
#top{
  position:absolute;top:0;left:0;right:0;z-index:200;
  padding:calc(var(--sat)+10px) 13px 10px;
  background:linear-gradient(to bottom,rgba(15,15,15,.96) 55%,transparent);
  pointer-events:none;
}
.top-row{pointer-events:all;display:flex;align-items:center;gap:8px;}
.gps-pill{display:flex;align-items:center;gap:6px;background:rgba(15,15,15,.88);border:1px solid var(--bd);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--dim);white-space:nowrap;flex-shrink:0;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);transition:background .3s;}
.dot.ok{background:var(--acc);} .dot.searching{background:#ffb300;animation:blink 1.1s infinite;} .dot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}
.sw{flex:1;position:relative;}
.s-in{width:100%;background:rgba(15,15,15,.9);border:1px solid var(--bd);border-radius:11px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 42px 9px 13px;outline:none;-webkit-appearance:none;}
.s-in:focus{border-color:var(--acc);}
.s-in::placeholder{color:var(--dim);}
.btn-s{position:absolute;right:0;top:0;bottom:0;width:44px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-s svg{width:17px;height:17px;stroke:var(--dim);}
.sr-drop{position:absolute;top:calc(100%+6px);left:0;right:0;background:rgba(18,18,18,.99);border:1px solid var(--bd);border-radius:11px;overflow:hidden;display:none;z-index:400;max-height:220px;overflow-y:auto;}
.sr-drop.on{display:block;}
.sri{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--bd);}
.sri:last-child{border-bottom:none;} .sri:active{background:var(--p2);}
.sri-n{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:2px;}
.sri-a{font-size:11px;color:var(--dim);}

/* NAV HEADER */
#nav-hdr{
  position:absolute;z-index:200;left:13px;right:13px;
  background:rgba(13,13,13,.95);border:1px solid var(--bd);border-radius:14px;
  padding:11px 14px;display:none;align-items:center;gap:12px;
}
#nav-hdr.on{display:flex;}
.nh-ic{width:40px;height:40px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nh-ic svg{width:22px;height:22px;}
.nh-dist{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--acc);line-height:1;}
.nh-lbl{font-size:11px;color:var(--dim);margin-top:1px;}

/* ROUTE RIBBON */
#ribbon{position:absolute;left:0;right:0;z-index:150;background:rgba(13,13,13,.94);border-top:1px solid var(--bd);padding:10px 14px;display:none;align-items:center;gap:11px;}
#ribbon.on{display:flex;}
.rib-ic{width:34px;height:34px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rib-ic svg{width:18px;height:18px;}
.rib-info{flex:1;min-width:0;}
.rib-dest{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rib-sub{font-size:11px;color:var(--dim);margin-top:1px;}
.rib-data{display:flex;gap:16px;text-align:right;flex-shrink:0;}
.rd-v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--acc);line-height:1;}
.rd-u{font-size:10px;color:var(--dim);}
.btn-xr{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:2px 4px;line-height:1;flex-shrink:0;}

/* RECENTER */
#btn-rc{position:absolute;right:13px;z-index:150;width:44px;height:44px;background:rgba(15,15,15,.9);border:1px solid var(--bd);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#btn-rc svg{width:20px;height:20px;stroke:var(--dim);}
#btn-rc.on{background:var(--acc2);border-color:var(--acc3);}
#btn-rc.on svg{stroke:var(--acc);}

/* BOTTOM PANEL */
#bot{position:absolute;bottom:0;left:0;right:0;z-index:200;background:var(--p1);border-top:1px solid var(--bd);padding:14px 15px calc(var(--sab)+14px);}
.spd-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;}
.sb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim);}
.sb-num{font-family:'Bebas Neue',sans-serif;font-size:86px;line-height:.88;letter-spacing:-4px;color:var(--txt);transition:color .3s;}
.sb-num.go{color:var(--acc);}
.sb-unit{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:4px;}
.tb{text-align:right;}
.tb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);}
.tb-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--txt);line-height:1;}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;}
.sc{background:var(--p2);border-radius:9px;padding:8px 10px;}
.sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:2px;}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--txt);line-height:1;}
.sc-u{font-size:9px;color:var(--dim);margin-left:2px;}
.ctrls{display:flex;gap:8px;align-items:center;}
.btn-main{flex:1;height:52px;background:var(--acc);color:var(--bg);border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;}
.btn-main:active{transform:scale(.97);}
.btn-main:disabled{opacity:.3;cursor:not-allowed;}
.ic-btn{width:52px;height:52px;flex-shrink:0;background:var(--p2);border:1px solid var(--bd);border-radius:13px;display:none;align-items:center;justify-content:center;cursor:pointer;}
.ic-btn.vis{display:flex;} .ic-btn:active{background:var(--mute);}
.ic-btn svg{width:21px;height:21px;stroke:var(--dim);}
.ic-btn.paus{background:var(--acc2);border-color:var(--acc3);}
.ic-btn.paus svg{stroke:var(--acc);}
.ic-btn.stop-b svg{stroke:var(--red);}

/* HISTORY SHEET */
#hs{position:absolute;bottom:0;left:0;right:0;z-index:500;background:var(--p1);border-radius:22px 22px 0 0;border-top:1px solid var(--bd);max-height:78vh;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;}
#hs.open{transform:translateY(0);}
.hs-handle{width:38px;height:4px;background:var(--bd);border-radius:2px;margin:13px auto 0;}
.hs-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px;}
.hs-ttl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);}
.hs-x{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:4px;}
.hs-body{overflow-y:auto;flex:1;padding:0 13px calc(var(--sab)+16px);}
.hs-body::-webkit-scrollbar{display:none;}
.empty{padding:52px 20px;text-align:center;color:var(--dim);}
.empty-i{font-size:38px;margin-bottom:12px;opacity:.22;} .empty-t{font-size:13px;line-height:1.8;}
.r-card{background:var(--p2);border-radius:12px;padding:14px;margin-bottom:10px;}
.r-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.r-date{font-size:12px;color:var(--dim);}
.r-dest-t{font-size:10px;color:var(--acc);margin-top:2px;}
.r-dur{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--acc);}
.r-st{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rst-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);}
.rst-v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--txt);line-height:1.2;}
.rst-u{font-size:9px;color:var(--dim);margin-left:2px;}

/* GPS HELP */
#gpsh{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:600;background:var(--p1);border:1px solid var(--bd);border-radius:18px;padding:26px 22px;text-align:center;max-width:300px;width:92%;display:none;}
#gpsh.on{display:block;}
.gh-ico{font-size:34px;margin-bottom:14px;}
.gh-ttl{font-size:16px;font-weight:600;margin-bottom:8px;}
.gh-msg{font-size:12px;color:var(--dim);line-height:1.65;margin-bottom:14px;}
.gh-step{background:var(--p2);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:12px;color:var(--dim);line-height:1.6;text-align:left;}
.gh-step b{color:var(--txt);}
.gh-btn{margin-top:14px;width:100%;padding:13px;background:var(--acc);color:var(--bg);border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.gh-btn2{margin-top:8px;width:100%;padding:11px;background:transparent;color:var(--dim);border:1px solid var(--bd);border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}

/* Kakao map dark overlay */
.map-dark{filter:invert(92%) hue-rotate(180deg);}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <!-- TOP -->
  <div id="top">
    <div class="top-row">
      <div class="gps-pill"><div class="dot" id="gdot"></div><span id="gtxt">GPS 대기</span></div>
      <div class="sw">
        <input class="s-in" id="si" type="text" placeholder="목적지 검색..." autocomplete="off">
        <button class="btn-s" onclick="doSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </button>
        <div class="sr-drop" id="sr"></div>
      </div>
    </div>
  </div>

  <!-- NAV HEADER -->
  <div id="nav-hdr">
    <div class="nh-ic">
      <svg viewBox="0 0 24 24" fill="#0f0f0f"><path d="M12 2l8 19-8-4.5L4 21z"/></svg>
    </div>
    <div>
      <div class="nh-dist" id="nh-dist">—</div>
      <div class="nh-lbl">목적지까지 남은 거리</div>
    </div>
  </div>

  <!-- RIBBON -->
  <div id="ribbon">
    <div class="rib-ic">
      <svg viewBox="0 0 24 24" fill="#0f0f0f"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
    </div>
    <div class="rib-info">
      <div class="rib-dest" id="rd">목적지</div>
      <div class="rib-sub" id="rs">경로 계산 중...</div>
    </div>
    <div class="rib-data">
      <div><div class="rd-v" id="rv-d">—</div><div class="rd-u">km</div></div>
      <div><div class="rd-v" id="rv-t">—</div><div class="rd-u">분</div></div>
    </div>
    <button class="btn-xr" onclick="clearRoute()">✕</button>
  </div>

  <!-- RECENTER -->
  <button id="btn-rc" onclick="recenter()">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      <circle cx="12" cy="12" r="9" stroke-dasharray="3 4"/>
    </svg>
  </button>

  <!-- BOTTOM -->
  <div id="bot">
    <div class="spd-row">
      <div>
        <div class="sb-lbl">현재 속도</div>
        <div class="sb-num" id="spd">0</div>
        <div class="sb-unit">KM / H</div>
      </div>
      <div class="tb">
        <div class="tb-lbl">라이딩 시간</div>
        <div class="tb-val" id="tv">00:00</div>
      </div>
    </div>
    <div class="stats3">
      <div class="sc"><div class="sc-lbl">거리</div><div class="sc-val" id="sd">0.00<span class="sc-u">km</span></div></div>
      <div class="sc"><div class="sc-lbl">평균속도</div><div class="sc-val" id="sa">0.0<span class="sc-u">km/h</span></div></div>
      <div class="sc"><div class="sc-lbl">칼로리</div><div class="sc-val" id="scal">0<span class="sc-u">kcal</span></div></div>
    </div>
    <div class="ctrls">
      <button class="btn-main" id="bg" onclick="handleMain()">라이딩 시작</button>
      <button class="ic-btn paus" id="bp" onclick="togglePause()">
        <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="ic-btn stop-b" id="bs" onclick="stopRide()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
      </button>
      <button class="ic-btn vis" onclick="openHist()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      </button>
    </div>
  </div>

  <!-- GPS HELP -->
  <div id="gpsh">
    <div class="gh-ico">📍</div>
    <div class="gh-ttl">위치 권한이 필요해요</div>
    <div class="gh-msg">GPS 권한을 허용해야<br>속도와 거리를 측정할 수 있어요.</div>
    <div class="gh-step">① 주소창 맨 왼쪽 <b>ⓘ 아이콘</b> 탭</div>
    <div class="gh-step">② <b>권한</b> → <b>위치</b> → <b>허용</b></div>
    <div class="gh-step">③ 페이지 <b>새로고침</b> 후 재시도</div>
    <button class="gh-btn" onclick="retryGPS()">다시 시도</button>
    <button class="gh-btn2" onclick="document.getElementById('gpsh').classList.remove('on')">GPS 없이 계속</button>
  </div>

  <!-- HISTORY -->
  <div id="hs">
    <div class="hs-handle"></div>
    <div class="hs-head">
      <span class="hs-ttl">라이딩 기록</span>
      <button class="hs-x" onclick="closeHist()">×</button>
    </div>
    <div class="hs-body" id="hb"></div>
  </div>
</div>

<script>
// ── PWA ICON ──
const BIKE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0f0f0f"/><circle cx="140" cy="340" r="85" fill="none" stroke="#b8ff00" stroke-width="30"/><circle cx="372" cy="340" r="85" fill="none" stroke="#b8ff00" stroke-width="30"/><path d="M140 340L240 168H372" fill="none" stroke="#b8ff00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 340L256 248L372 340" fill="none" stroke="#b8ff00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><line x1="372" y1="168" x2="420" y2="138" stroke="#b8ff00" stroke-width="24" stroke-linecap="round"/><line x1="408" y1="125" x2="438" y2="155" stroke="#b8ff00" stroke-width="24" stroke-linecap="round"/><line x1="228" y1="168" x2="272" y2="168" stroke="#b8ff00" stroke-width="24" stroke-linecap="round"/><circle cx="256" cy="310" r="24" fill="none" stroke="#b8ff00" stroke-width="20"/><circle cx="256" cy="120" r="18" fill="#b8ff00"/></svg>`;
(function(){
  const blob=new Blob([BIKE_SVG],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=512;
    c.getContext('2d').drawImage(img,0,0,512,512);
    const png=c.toDataURL('image/png');
    document.getElementById('ati').href=png;
    document.getElementById('fav').href=url;
    try{
      const m={name:'사이클 트래커',short_name:'사이클',description:'자전거 라이딩 네비게이션',
        start_url:location.href,display:'standalone',orientation:'portrait',
        background_color:'#0f0f0f',theme_color:'#b8ff00',
        icons:[{src:png,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
      const ml=document.createElement('link');ml.rel='manifest';
      ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
      document.head.appendChild(ml);
    }catch(e){}
  };img.src=url;
})();

// ── STATE ──
const S={
  riding:false,paused:false,t0:null,pausedMs:0,pauseStart:null,
  dist:0,spd:0,maxSpd:0,lastPos:null,ticker:null,
  gpsOk:false,heading:0,
  destName:'',destCoord:null,
  routePts:[],routeIdx:0,
};
let curLat=null,curLng=null;
let map=null,uOverlay=null,dMarker=null;
let rFull=null,rPassed=null,rRemain=null;
let memRides=[],userPanned=false;

// ── MAP (KAKAO) ──
function initMap(){
  const container=document.getElementById('map');
  map=new kakao.maps.Map(container,{
    center:new kakao.maps.LatLng(37.5665,126.978),
    level:4
  });
  // Dark-ish map type
  map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);

  // User position overlay (custom HTML arrow)
  uOverlay=new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(37.5665,126.978),
    content:makeArrow(0,false),
    map,zIndex:10,yAnchor:.5,xAnchor:.5
  });
  kakao.maps.event.addListener(map,'dragstart',()=>{userPanned=true;updateRC();});
  layout();window.addEventListener('resize',layout);
}

function makeArrow(heading,moving){
  const c=moving?'#b8ff00':'#fff';
  const bg=moving?'rgba(15,15,15,.85)':'rgba(15,15,15,.7)';
  return `<div style="width:28px;height:28px;border-radius:50%;background:${bg};border:2.5px solid ${c};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px ${moving?'rgba(184,255,0,.18)':'rgba(255,255,255,.1)'};transform:rotate(${heading}deg);">
    <svg width="13" height="13" viewBox="0 0 13 13"><polygon points="6.5,1 11,12 6.5,9 2,12" fill="${c}"/></svg>
  </div>`;
}

function layout(){
  const bh=document.getElementById('bot').offsetHeight;
  const th=document.getElementById('top').offsetHeight;
  document.getElementById('ribbon').style.bottom=bh+'px';
  document.getElementById('btn-rc').style.bottom=(bh+12)+'px';
  document.getElementById('nav-hdr').style.top=(th+8)+'px';
}
function updateRC(){
  document.getElementById('btn-rc').className=userPanned?'':'on';
}

// ── GPS ──
function initGPS(){
  if(!navigator.geolocation){setGPS('GPS 미지원','err');return;}
  setGPS('검색중...','searching');
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
function setGPS(t,c){document.getElementById('gtxt').textContent=t;document.getElementById('gdot').className='dot '+c;}
function onPos(p){
  const{latitude:la,longitude:ln,speed:sp,heading:hdg}=p.coords;
  curLat=la;curLng=ln;
  if(!S.gpsOk){
    S.gpsOk=true;setGPS('GPS 연결','ok');
    document.getElementById('gpsh').classList.remove('on');
    map.setCenter(new kakao.maps.LatLng(la,ln));map.setLevel(3);
  }
  // Heading
  if(hdg!=null&&!isNaN(hdg)&&S.spd>2)S.heading=hdg;
  else if(S.lastPos&&hav(S.lastPos.la,S.lastPos.ln,la,ln)>3)
    S.heading=bearing(S.lastPos.la,S.lastPos.ln,la,ln);

  const moving=S.riding&&!S.paused&&S.spd>1;
  if(uOverlay){
    uOverlay.setPosition(new kakao.maps.LatLng(la,ln));
    uOverlay.setContent(makeArrow(S.heading,moving));
  }
  if(!S.riding||S.paused)return;

  // Speed
  let kmh=0;
  if(sp!=null&&sp>=0)kmh=sp*3.6;
  else if(S.lastPos){const dt=(p.timestamp-S.lastPos.ts)/1000;if(dt>0){const d=hav(S.lastPos.la,S.lastPos.ln,la,ln);kmh=(d/1000)/(dt/3600);}}
  if(kmh>90)kmh=S.spd;
  S.spd=Math.round(kmh*10)/10;if(S.spd>S.maxSpd)S.maxSpd=S.spd;
  const el=document.getElementById('spd');
  el.textContent=Math.round(S.spd);el.className='sb-num'+(S.spd>1?' go':'');

  // Distance
  if(S.lastPos){const d=hav(S.lastPos.la,S.lastPos.ln,la,ln);if(d<150)S.dist+=d;}
  S.lastPos={la,ln,ts:p.timestamp};
  updStats();

  // Navigation
  if(S.routePts.length>1)tickNav(la,ln);

  // Map follow — offset so user appears lower on screen
  if(!userPanned){
    const rad=S.heading*Math.PI/180;
    const off=0.0008;
    map.setCenter(new kakao.maps.LatLng(la+off*Math.cos(rad),ln+off*Math.sin(rad)/Math.cos(la*Math.PI/180)));
  }
}
function onErr(e){
  if(S.gpsOk)return;
  if(e&&e.code===1){setGPS('권한 없음','err');document.getElementById('gpsh').classList.add('on');}
  else setGPS('신호 약함...','searching');
}
function retryGPS(){
  document.getElementById('gpsh').classList.remove('on');
  S.gpsOk=false;setGPS('재시도중...','searching');
  navigator.geolocation.getCurrentPosition(onPos,onErr,{enableHighAccuracy:true,timeout:20000});
}
function bearing(a1,b1,a2,b2){
  const dL=(b2-b1)*Math.PI/180,y=Math.sin(dL)*Math.cos(a2*Math.PI/180);
  const x=Math.cos(a1*Math.PI/180)*Math.sin(a2*Math.PI/180)-Math.sin(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.cos(dL);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
function hav(a1,b1,a2,b2){
  const R=6371000,dA=(a2-a1)*Math.PI/180,dB=(b2-b1)*Math.PI/180;
  const x=Math.sin(dA/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dB/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ── NAVIGATION ──
function tickNav(la,ln){
  let minD=Infinity,best=S.routeIdx;
  const from=Math.max(0,S.routeIdx-3),to=Math.min(S.routePts.length-1,S.routeIdx+15);
  for(let i=from;i<=to;i++){const d=hav(la,ln,S.routePts[i].la,S.routePts[i].ln);if(d<minD){minD=d;best=i;}}
  S.routeIdx=best;
  // Remaining distance
  let rem=0;
  for(let i=best;i<S.routePts.length-1;i++)rem+=hav(S.routePts[i].la,S.routePts[i].ln,S.routePts[i+1].la,S.routePts[i+1].ln);
  const txt=rem<1000?Math.round(rem)+'m':(rem/1000).toFixed(1)+'km';
  document.getElementById('nh-dist').textContent=txt;
  document.getElementById('rs').textContent='남은 거리 '+txt;
  document.getElementById('nav-hdr').classList.add('on');
  redrawRoute(best);
}
function redrawRoute(idx){
  if(!S.routePts.length)return;
  if(rPassed){rPassed.setMap(null);rPassed=null;}
  if(rRemain){rRemain.setMap(null);rRemain=null;}
  if(rFull){rFull.setMap(null);rFull=null;}
  const passed=S.routePts.slice(0,idx+1).map(p=>new kakao.maps.LatLng(p.la,p.ln));
  const remain=S.routePts.slice(idx).map(p=>new kakao.maps.LatLng(p.la,p.ln));
  if(passed.length>1)rPassed=new kakao.maps.Polyline({path:passed,strokeWeight:6,strokeColor:'#3a3a3a',strokeOpacity:1,strokeStyle:'solid',map});
  if(remain.length>1)rRemain=new kakao.maps.Polyline({path:remain,strokeWeight:7,strokeColor:'#b8ff00',strokeOpacity:.9,strokeStyle:'solid',map});
}

// ── RIDE ──
function handleMain(){if(!S.riding)startRide();}
function startRide(){
  S.riding=true;S.paused=false;S.t0=Date.now();S.pausedMs=0;
  S.dist=0;S.spd=0;S.maxSpd=0;S.lastPos=null;S.routeIdx=0;userPanned=false;
  document.getElementById('bg').textContent='라이딩 중...';document.getElementById('bg').disabled=true;
  document.getElementById('bp').classList.add('vis');document.getElementById('bs').classList.add('vis');
  if(S.routePts.length)document.getElementById('nav-hdr').classList.add('on');
  if(map)map.setLevel(3);
  S.ticker=setInterval(tick,1000);
}
function togglePause(){
  const b=document.getElementById('bp');
  if(!S.paused){
    S.paused=true;S.pauseStart=Date.now();S.spd=0;
    document.getElementById('spd').textContent='0';document.getElementById('spd').className='sb-num';
    b.style.cssText='display:flex;width:52px;height:52px;flex-shrink:0;border-radius:13px;align-items:center;justify-content:center;cursor:pointer;background:rgba(184,255,0,.12);border:1px solid rgba(184,255,0,.28);';
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="#b8ff00" stroke="none" width="21" height="21"><polygon points="5,3 19,12 5,21"/></svg>`;
  }else{
    S.paused=false;S.pausedMs+=Date.now()-S.pauseStart;
    b.style.cssText='display:flex;width:52px;height:52px;flex-shrink:0;border-radius:13px;align-items:center;justify-content:center;cursor:pointer;background:rgba(184,255,0,.1);border:1px solid rgba(184,255,0,.28);';
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" width="21" height="21"><rect x="6" y="4" width="4" height="16" rx="1" fill="#b8ff00" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="#b8ff00" stroke="none"/></svg>`;
  }
}
function stopRide(){
  if(!S.riding)return;
  const ms=rideMs(),dk=(S.dist/1000).toFixed(2);
  const avg=ms>8000?(parseFloat(dk)/(ms/3600000)).toFixed(1):'0.0';
  saveRide({ts:Date.now(),date:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),dur:fmt(ms),dist:dk,avg,max:S.maxSpd.toFixed(1),cal:Math.round(parseFloat(dk)*35),dest:S.destName||null});
  S.riding=false;S.paused=false;clearInterval(S.ticker);S.spd=0;S.dist=0;S.routeIdx=0;
  document.getElementById('spd').textContent='0';document.getElementById('spd').className='sb-num';
  document.getElementById('tv').textContent='00:00';
  document.getElementById('sd').innerHTML='0.00<span class="sc-u">km</span>';
  document.getElementById('sa').innerHTML='0.0<span class="sc-u">km/h</span>';
  document.getElementById('scal').innerHTML='0<span class="sc-u">kcal</span>';
  document.getElementById('bg').textContent='라이딩 시작';document.getElementById('bg').disabled=false;
  document.getElementById('bp').classList.remove('vis');document.getElementById('bs').classList.remove('vis');
  document.getElementById('nav-hdr').classList.remove('on');
  // Reset route
  if(S.routePts.length){
    if(rPassed){rPassed.setMap(null);rPassed=null;}if(rRemain){rRemain.setMap(null);rRemain=null;}
    rFull=new kakao.maps.Polyline({path:S.routePts.map(p=>new kakao.maps.LatLng(p.la,p.ln)),strokeWeight:6,strokeColor:'#b8ff00',strokeOpacity:.85,strokeStyle:'solid',map});
  }
}
function rideMs(){if(!S.t0)return 0;let p=S.pausedMs;if(S.paused&&S.pauseStart)p+=Date.now()-S.pauseStart;return Date.now()-S.t0-p;}
function tick(){if(!S.riding||S.paused)return;document.getElementById('tv').textContent=fmt(rideMs());}
function updStats(){
  const dk=S.dist/1000,ms=rideMs(),avg=ms>8000?(dk/(ms/3600000)).toFixed(1):'0.0';
  document.getElementById('sd').innerHTML=dk.toFixed(2)+'<span class="sc-u">km</span>';
  document.getElementById('sa').innerHTML=avg+'<span class="sc-u">km/h</span>';
  document.getElementById('scal').innerHTML=Math.round(dk*35)+'<span class="sc-u">kcal</span>';
}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h>0?h+':'+pad(m%60)+':'+pad(s%60):pad(m)+':'+pad(s%60);}
function pad(n){return String(n).padStart(2,'0');}

// ── MAP CONTROLS ──
function recenter(){
  userPanned=false;updateRC();
  if(curLat)map.setCenter(new kakao.maps.LatLng(curLat,curLng));
  map.setLevel(S.riding?3:4);
}

// ── SEARCH ──
async function doSearch(){
  const q=document.getElementById('si').value.trim();if(!q)return;
  const el=document.getElementById('sr');
  el.innerHTML='<div class="sri"><div class="sri-n">검색 중...</div></div>';el.classList.add('on');
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=ko&countrycodes=kr`);
    const d=await r.json();
    if(!d.length){el.innerHTML='<div class="sri"><div class="sri-n">결과가 없어요</div></div>';return;}
    el.innerHTML=d.map(p=>`<div class="sri" onclick='pick(${p.lat},${p.lon},${JSON.stringify(p.display_name)})'><div class="sri-n">${p.display_name.split(',')[0]}</div><div class="sri-a">${p.display_name.split(',').slice(1,3).join(', ')}</div></div>`).join('');
  }catch(e){el.innerHTML='<div class="sri"><div class="sri-n">검색 실패</div></div>';}
}
function pick(la,ln,name){
  document.getElementById('sr').classList.remove('on');
  la=parseFloat(la);ln=parseFloat(ln);
  const sh=name.split(',')[0];document.getElementById('si').value=sh;
  S.destName=sh;S.destCoord={la,ln};
  // Destination marker
  if(dMarker)dMarker.setMap(null);
  const ic=new kakao.maps.MarkerImage(
    'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="#ff4f4f" stroke="white" stroke-width="2.5"/></svg>`),
    new kakao.maps.Size(20,20),{offset:new kakao.maps.Point(10,10)}
  );
  dMarker=new kakao.maps.Marker({position:new kakao.maps.LatLng(la,ln),map,image:ic,zIndex:9});
  // Fit bounds
  const bounds=new kakao.maps.LatLngBounds();
  bounds.extend(new kakao.maps.LatLng(la,ln));
  if(curLat)bounds.extend(new kakao.maps.LatLng(curLat,curLng));
  map.setBounds(bounds,100,30,220,30);
  document.getElementById('ribbon').classList.add('on');
  document.getElementById('rd').textContent=sh;document.getElementById('rs').textContent='경로 계산 중...';
  document.getElementById('rv-d').textContent='—';document.getElementById('rv-t').textContent='—';
  layout();
  getRoute(curLat||la-.01,curLng||ln-.01,la,ln);
}

// ── ROUTING (OSRM) ──
async function getRoute(la1,ln1,la2,ln2){
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/cycling/${ln1},${la1};${ln2},${la2}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.routes&&d.routes.length){
      const rt=d.routes[0];
      const km=(rt.distance/1000).toFixed(1),min=Math.round(rt.duration/60);
      document.getElementById('rv-d').textContent=km;document.getElementById('rv-t').textContent=min;
      document.getElementById('rs').textContent='자전거 경로 준비됨';
      S.routePts=rt.geometry.coordinates.map(([lng,lat])=>({la:lat,ln:lng}));S.routeIdx=0;
      if(rFull)rFull.setMap(null);if(rPassed){rPassed.setMap(null);rPassed=null;}if(rRemain){rRemain.setMap(null);rRemain=null;}
      rFull=new kakao.maps.Polyline({path:S.routePts.map(p=>new kakao.maps.LatLng(p.la,p.ln)),strokeWeight:6,strokeColor:'#b8ff00',strokeOpacity:.88,strokeStyle:'solid',map});
    }
  }catch(e){document.getElementById('rs').textContent='경로를 불러올 수 없어요';}
}
function clearRoute(){
  S.destName='';S.destCoord=null;S.routePts=[];S.routeIdx=0;
  document.getElementById('ribbon').classList.remove('on');document.getElementById('nav-hdr').classList.remove('on');
  document.getElementById('si').value='';
  if(dMarker){dMarker.setMap(null);dMarker=null;}
  if(rFull){rFull.setMap(null);rFull=null;}if(rPassed){rPassed.setMap(null);rPassed=null;}if(rRemain){rRemain.setMap(null);rRemain=null;}
  layout();
}

// ── HISTORY ──
function openHist(){loadHist();document.getElementById('hs').classList.add('open');}
function closeHist(){document.getElementById('hs').classList.remove('open');}
async function saveRide(r){try{await window.storage.set('ride:'+r.ts,JSON.stringify(r));}catch(e){memRides.unshift(r);}}
async function getRides(){
  let rides=[];
  try{const res=await window.storage.list('ride:');if(res&&res.keys&&res.keys.length)for(const k of res.keys){try{const r=await window.storage.get(k);if(r)rides.push(JSON.parse(r.value));}catch(e){}}}
  catch(e){rides=[...memRides];}
  return rides.sort((a,b)=>b.ts-a.ts);
}
async function loadHist(){
  const rides=await getRides();const b=document.getElementById('hb');
  if(!rides.length){b.innerHTML='<div class="empty"><div class="empty-i">🚴</div><div class="empty-t">아직 기록이 없어요.<br>첫 라이딩을 시작해보세요!</div></div>';return;}
  b.innerHTML=rides.map(r=>`<div class="r-card"><div class="r-top"><div><div class="r-date">${r.date}</div>${r.dest?`<div class="r-dest-t">📍 ${r.dest}</div>`:''}</div><div class="r-dur">${r.dur}</div></div><div class="r-st"><div><div class="rst-l">거리</div><div class="rst-v">${r.dist}<span class="rst-u">km</span></div></div><div><div class="rst-l">평균속도</div><div class="rst-v">${r.avg}<span class="rst-u">km/h</span></div></div><div><div class="rst-l">칼로리</div><div class="rst-v">${r.cal}<span class="rst-u">kcal</span></div></div></div></div>`).join('');
}

// ── INIT ──
document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
document.addEventListener('click',e=>{
  if(!e.target.closest('#top'))document.getElementById('sr').classList.remove('on');
  if(!e.target.closest('#hs')&&!e.target.closest('[onclick*="openHist"]'))document.getElementById('hs').classList.remove('open');
});

// Wait for Kakao Maps to load
kakao.maps.load(()=>{ initMap(); initGPS(); });
</script>
