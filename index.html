<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>사이클 트래커 PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* 기존 스타일 유지 및 일부 보정 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;--panel:#111111;--p2:#1a1a1a;
  --acc:#b8ff00;--acc2:rgba(184,255,0,.12);--acc3:rgba(184,255,0,.28);
  --txt:#f0f0f0;--dim:#7a7a7a;--mute:#333;
  --bd:#242424;--red:#ff4f4f;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;overflow:hidden;color:var(--txt);}
#app{position:fixed;inset:0;}
#map{position:absolute;inset:0;z-index:1;}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important;}

/* UI 요소 */
#top{position:absolute;top:0;left:0;right:0;z-index:200;padding:calc(var(--sat) + 10px) 13px 10px;background:linear-gradient(to bottom,rgba(15,15,15,.96) 55%,transparent);pointer-events:none;}
.top-row{pointer-events:all;display:flex;align-items:center;gap:8px;}
.gps-pill{display:flex;align-items:center;gap:6px;background:rgba(15,15,15,.88);border:1px solid var(--bd);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--dim);font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);}
.dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc);}
.dot.searching{background:#ffaa00;animation:blink 1.1s infinite;}
.dot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

.sw{flex:1;position:relative;}
.s-in{width:100%;background:rgba(15,15,15,.9);border:1px solid var(--bd);border-radius:11px;color:var(--txt);font-size:14px;padding:9px 42px 9px 14px;outline:none;}
.btn-s{position:absolute;right:0;top:0;bottom:0;width:44px;background:none;border:none;display:flex;align-items:center;justify-content:center;}
.btn-s svg{width:17px;height:17px;stroke:var(--dim);fill:none;}

#ribbon{position:absolute;left:0;right:0;z-index:150;background:rgba(13,13,13,.92);border-top:1px solid var(--bd);padding:10px 14px;display:none;align-items:center;gap:11px;}
#ribbon.on{display:flex;}

#bot{position:absolute;bottom:0;left:0;right:0;z-index:200;background:var(--panel);border-top:1px solid var(--bd);padding:14px 15px calc(var(--sab) + 14px);}
.sb-num{font-family:'Bebas Neue',sans-serif;font-size:84px;line-height:.88;color:var(--txt);}
.sb-num.go{color:var(--acc);}
.tb-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--txt);}

.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px 0;}
.sc{background:var(--p2);border-radius:9px;padding:8px 10px;}
.sc-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;margin-bottom:2px;}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--txt);}

.ctrls{display:flex;gap:8px;}
.btn-main{flex:1;height:52px;background:var(--acc);color:#0f0f0f;border:none;border-radius:13px;font-weight:700;font-size:15px;cursor:pointer;}
.ic-btn{width:52px;height:52px;background:var(--p2);border:1px solid var(--bd);border-radius:13px;display:none;align-items:center;justify-content:center;}
.ic-btn.vis{display:flex;}

#hs{position:absolute;bottom:0;left:0;right:0;z-index:500;background:var(--panel);border-radius:22px 22px 0 0;max-height:70vh;transform:translateY(100%);transition:transform .3s;}
#hs.open{transform:translateY(0);}
.hs-body{overflow-y:auto;padding:15px;}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="top">
    <div class="top-row">
      <div class="gps-pill"><div class="dot" id="gdot"></div><span id="gtxt">GPS 연결대기</span></div>
      <div class="sw">
        <input class="s-in" id="si" type="text" placeholder="목적지 검색" autocomplete="off">
        <button class="btn-s" onclick="doSearch()"><svg viewBox="0 0 24 24" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></button>
      </div>
    </div>
  </div>

  <div id="bot">
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div><div class="sb-num" id="spd">0</div><div style="font-size:12px; color:var(--dim)">KM/H</div></div>
      <div style="text-align:right"><div style="font-size:10px; color:var(--dim)">TIME</div><div class="tb-val" id="tv">00:00</div></div>
    </div>
    <div class="stats3">
      <div class="sc"><div class="sc-lbl">거리</div><div class="sc-val" id="sd">0.00</div></div>
      <div class="sc"><div class="sc-lbl">평균</div><div class="sc-val" id="sa">0.0</div></div>
      <div class="sc"><div class="sc-lbl">칼로리</div><div class="sc-val" id="sc">0</div></div>
    </div>
    <div class="ctrls">
      <button class="btn-main" id="bg" onclick="startRide()">라이딩 시작</button>
      <button class="ic-btn" id="bs" onclick="stopRide()" style="background:var(--red)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="ic-btn vis" onclick="openHist()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
    </div>
  </div>

  <div id="hs">
    <div style="padding:15px; display:flex; justify-content:space-between; border-bottom:1px solid var(--bd);">
      <strong>최근 기록</strong>
      <button onclick="closeHist()" style="background:none; border:none; color:var(--dim)">닫기</button>
    </div>
    <div class="hs-body" id="hb"></div>
  </div>
</div>

<script>
// 상태 관리
const State = {
  riding: false,
  startTime: null,
  distance: 0, // meters
  lastPos: null,
  timer: null,
  path: []
};

let map, userMarker, watchId;

// 지도 초기화
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([37.5665, 126.978], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  userMarker = L.circleMarker([37.5665, 126.978], { color: '#b8ff00', radius: 8, fillOpacity: 1 }).addTo(map);
}

// GPS 로직 수정
function initGPS() {
  if (!navigator.geolocation) {
    updateGpsStatus('미지원', 'err');
    return;
  }

  updateGpsStatus('위치 찾는 중...', 'searching');

  // watchPosition을 사용하여 실시간 추적
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, speed } = pos.coords;
      const currentLatLng = [latitude, longitude];

      updateGpsStatus('GPS 연결됨', 'ok');
      userMarker.setLatLng(currentLatLng);
      
      if (!State.riding) {
        map.panTo(currentLatLng);
      } else {
        calculateDistance(latitude, longitude);
        updateSpeed(speed);
        State.path.push(currentLatLng);
        map.setView(currentLatLng);
      }
    },
    (err) => {
      console.error(err);
      updateGpsStatus('GPS 에러', 'err');
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

function updateGpsStatus(msg, status) {
  document.getElementById('gtxt').innerText = msg;
  document.getElementById('gdot').className = 'dot ' + status;
}

function calculateDistance(lat, lon) {
  if (State.lastPos) {
    const d = map.distance([lat, lon], [State.lastPos.lat, State.lastPos.lon]);
    if (d > 2 && d < 100) { // 튐 방지: 2m 이상 이동시에만 기록
      State.distance += d;
      document.getElementById('sd').innerText = (State.distance / 1000).toFixed(2);
      document.getElementById('sc').innerText = Math.round((State.distance / 1000) * 35);
    }
  }
  State.lastPos = { lat, lon };
}

function updateSpeed(s) {
  const kmh = s ? Math.round(s * 3.6) : 0;
  const el = document.getElementById('spd');
  el.innerText = kmh;
  el.className = 'sb-num' + (kmh > 0 ? ' go' : '');
}

// 라이딩 제어
function startRide() {
  State.riding = true;
  State.startTime = Date.now();
  State.distance = 0;
  State.lastPos = null;
  
  document.getElementById('bg').style.display = 'none';
  document.getElementById('bs').classList.add('vis');
  
  State.timer = setInterval(() => {
    const diff = Date.now() - State.startTime;
    const m = Math.floor(diff / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('tv').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function stopRide() {
  clearInterval(State.timer);
  State.riding = false;
  
  // 데이터 저장
  const record = {
    date: new Date().toLocaleString(),
    dist: (State.distance / 1000).toFixed(2),
    time: document.getElementById('tv').innerText
  };
  
  const history = JSON.parse(localStorage.getItem('ride_history') || '[]');
  history.unshift(record);
  localStorage.setItem('ride_history', JSON.stringify(history));

  alert(`라이딩 종료! \n거리: ${record.dist}km \n시간: ${record.time}`);
  location.reload(); // 상태 초기화
}

function openHist() {
  const history = JSON.parse(localStorage.getItem('ride_history') || '[]');
  const hb = document.getElementById('hb');
  hb.innerHTML = history.map(r => `
    <div style="background:var(--p2); padding:10px; border-radius:8px; margin-bottom:8px;">
      <div style="font-size:12px; color:var(--dim)">${r.date}</div>
      <div style="font-size:18px; font-weight:bold;">${r.dist} km / ${r.time}</div>
    </div>
  `).join('') || '기록이 없습니다.';
  document.getElementById('hs').classList.add('open');
}

function closeHist() {
  document.getElementById('hs').classList.remove('open');
}

// 초기화 실행
window.onload = () => {
  initMap();
  initGPS();
};
</script>
</body>
</html>
