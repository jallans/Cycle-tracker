<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>사이클 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;--panel:#111111;--p2:#1a1a1a;
  --acc:#b8ff00;--acc2:rgba(184,255,0,.12);--acc3:rgba(184,255,0,.28);
  --txt:#f0f0f0;--dim:#7a7a7a;--mute:#333;
  --bd:#242424;--red:#ff4f4f;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:#0f0f0f;font-family:'DM Sans',sans-serif;overflow:hidden;color:var(--txt);}
#app{position:fixed;inset:0;}

/* MAP */
#map{position:absolute;inset:0;z-index:1;}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important;}

/* TOP BAR */
#top{
  position:absolute;top:0;left:0;right:0;z-index:200;
  padding:calc(var(--sat) + 10px) 13px 10px;
  background:linear-gradient(to bottom,rgba(15,15,15,.96) 55%,transparent);
  pointer-events:none;
}
.top-row{pointer-events:all;display:flex;align-items:center;gap:8px;}
.gps-pill{display:flex;align-items:center;gap:6px;background:rgba(15,15,15,.88);border:1px solid var(--bd);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--dim);white-space:nowrap;flex-shrink:0;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0;transition:background .3s;}
.dot.ok{background:var(--acc);}
.dot.searching{background:#ffaa00;animation:blink 1.1s infinite;}
.dot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}
.sw{flex:1;position:relative;}
.s-in{
  width:100%;background:rgba(15,15,15,.9);border:1px solid var(--bd);
  border-radius:11px;color:var(--txt);font-family:'DM Sans',sans-serif;
  font-size:14px;padding:9px 42px 9px 14px;outline:none;-webkit-appearance:none;
}
.s-in:focus{border-color:var(--acc);}
.s-in::placeholder{color:var(--dim);}
.btn-s{position:absolute;right:0;top:0;bottom:0;width:44px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-s svg{width:17px;height:17px;stroke:var(--dim);}
.sr{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:rgba(18,18,18,.98);border:1px solid var(--bd);border-radius:11px;
  overflow:hidden;display:none;z-index:400;
}
.sr.on{display:block;}
.sri{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .15s;}
.sri:last-child{border-bottom:none;}
.sri:active{background:var(--p2);}
.sri-n{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:2px;}
.sri-a{font-size:11px;color:var(--dim);}

/* RIBBON */
#ribbon{
  position:absolute;left:0;right:0;z-index:150;
  background:rgba(13,13,13,.92);border-top:1px solid var(--bd);
  padding:10px 14px;display:none;align-items:center;gap:11px;
}
#ribbon.on{display:flex;}
.rib-ic{width:34px;height:34px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rib-ic svg{width:18px;height:18px;}
.rib-info{flex:1;min-width:0;}
.rib-dest{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rib-sub{font-size:11px;color:var(--dim);margin-top:1px;}
.rib-data{display:flex;gap:16px;text-align:right;flex-shrink:0;}
.rd-v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--acc);line-height:1;}
.rd-u{font-size:10px;color:var(--dim);}
.btn-cr{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 2px;line-height:1;flex-shrink:0;}

/* RECENTER */
#btn-rc{
  position:absolute;right:13px;z-index:150;
  width:44px;height:44px;background:rgba(15,15,15,.88);
  border:1px solid var(--bd);border-radius:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#btn-rc svg{width:20px;height:20px;stroke:var(--dim);}

/* BOTTOM PANEL */
#bot{
  position:absolute;bottom:0;left:0;right:0;z-index:200;
  background:var(--panel);border-top:1px solid var(--bd);
  padding:14px 15px calc(var(--sab) + 14px);
}
.spd-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:11px;}
.sb{}
.sb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim);}
.sb-num{font-family:'Bebas Neue',sans-serif;font-size:84px;line-height:.88;letter-spacing:-3px;color:var(--txt);transition:color .3s;}
.sb-num.go{color:var(--acc);}
.sb-unit{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:4px;}
.tb{text-align:right;}
.tb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);}
.tb-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--txt);line-height:1;}

.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;}
.sc{background:var(--p2);border-radius:9px;padding:8px 10px;}
.sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:2px;}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--txt);line-height:1;}
.sc-u{font-size:9px;color:var(--dim);margin-left:2px;}

.ctrls{display:flex;gap:8px;align-items:center;}
.btn-main{
  flex:1;height:52px;background:var(--acc);color:#0f0f0f;
  border:none;border-radius:13px;font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .2s,transform .1s;
}
.btn-main:active{transform:scale(.97);}
.btn-main:disabled{opacity:.32;cursor:not-allowed;}
.ic-btn{
  width:52px;height:52px;flex-shrink:0;background:var(--p2);
  border:1px solid var(--bd);border-radius:13px;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s;
}
.ic-btn.vis{display:flex;}
.ic-btn:active{background:var(--mute);}
.ic-btn svg{width:21px;height:21px;stroke:var(--dim);}
.ic-btn.paus{background:var(--acc2);border-color:var(--acc3);}
.ic-btn.paus svg{stroke:var(--acc);}
.ic-btn.stop svg{stroke:var(--red);}
.ic-btn.hist svg{stroke:var(--dim);}

/* HISTORY SHEET */
#hs{
  position:absolute;bottom:0;left:0;right:0;z-index:500;
  background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--bd);
  max-height:78vh;transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
#hs.open{transform:translateY(0);}
.hs-handle{width:38px;height:4px;background:var(--bd);border-radius:2px;margin:13px auto 0;}
.hs-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px;}
.hs-ttl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);}
.hs-x{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:4px;}
.hs-body{overflow-y:auto;flex:1;padding:0 13px calc(var(--sab) + 16px);}
.hs-body::-webkit-scrollbar{display:none;}

.empty{padding:52px 20px;text-align:center;color:var(--dim);}
.ei{font-size:38px;margin-bottom:12px;opacity:.22;}
.et{font-size:13px;line-height:1.8;}
.rc{background:var(--p2);border-radius:12px;padding:14px;margin-bottom:10px;}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.rc-date{font-size:12px;color:var(--dim);}
.rc-dest{font-size:10px;color:var(--acc);margin-top:2px;}
.rc-dur{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--acc);}
.rc-st{display:grid;grid-template-columns:1fr 1fr 1fr;}
.rst-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);}
.rst-v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--txt);line-height:1.2;}
.rst-u{font-size:9px;color:var(--dim);margin-left:2px;}

/* GPS HELP */
#gpsh{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:600;background:var(--panel);border:1px solid var(--bd);border-radius:18px;
  padding:26px 22px;text-align:center;max-width:290px;width:90%;display:none;
}
#gpsh.on{display:block;}
.gh-ico{font-size:34px;margin-bottom:14px;}
.gh-ttl{font-size:16px;font-weight:600;margin-bottom:8px;}
.gh-msg{font-size:12px;color:var(--dim);line-height:1.65;}
.gh-steps{margin-top:14px;text-align:left;font-size:12px;color:var(--dim);line-height:1.9;}
.gh-steps b{color:var(--txt);font-weight:600;}
.gh-btn{margin-top:16px;width:100%;padding:12px;background:var(--acc);color:#0f0f0f;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <!-- TOP -->
  <div id="top">
    <div class="top-row">
      <div class="gps-pill"><div class="dot" id="gdot"></div><span id="gtxt">GPS 대기</span></div>
      <div class="sw">
        <input class="s-in" id="si" type="text" placeholder="목적지를 검색하세요..." autocomplete="off">
        <button class="btn-s" onclick="doSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </button>
        <div class="sr" id="sr"></div>
      </div>
    </div>
  </div>

  <!-- RIBBON -->
  <div id="ribbon">
    <div class="rib-ic">
      <svg viewBox="0 0 24 24" fill="#0f0f0f"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
    </div>
    <div class="rib-info">
      <div class="rib-dest" id="rd"></div>
      <div class="rib-sub" id="rs">경로 계산 중...</div>
    </div>
    <div class="rib-data">
      <div><div class="rd-v" id="rv-d">—</div><div class="rd-u">km</div></div>
      <div><div class="rd-v" id="rv-t">—</div><div class="rd-u">분</div></div>
    </div>
    <button class="btn-cr" onclick="clearRoute()">✕</button>
  </div>

  <!-- RECENTER -->
  <button id="btn-rc" onclick="recenter()">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8" stroke-dasharray="2.5 3.5"/>
      <line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/>
    </svg>
  </button>

  <!-- BOTTOM -->
  <div id="bot">
    <div class="spd-row">
      <div class="sb">
        <div class="sb-lbl">현재 속도</div>
        <div class="sb-num" id="spd">0</div>
        <div class="sb-unit">KM / H</div>
      </div>
      <div class="tb">
        <div class="tb-lbl">라이딩 시간</div>
        <div class="tb-val" id="tv">00:00</div>
      </div>
    </div>
    <div class="stats3">
      <div class="sc"><div class="sc-lbl">거리</div><div class="sc-val" id="sd">0.00<span class="sc-u">km</span></div></div>
      <div class="sc"><div class="sc-lbl">평균속도</div><div class="sc-val" id="sa">0.0<span class="sc-u">km/h</span></div></div>
      <div class="sc"><div class="sc-lbl">칼로리</div><div class="sc-val" id="sc">0<span class="sc-u">kcal</span></div></div>
    </div>
    <div class="ctrls">
      <button class="btn-main" id="bg" onclick="handleMain()">라이딩 시작</button>
      <button class="ic-btn paus" id="bp" onclick="togglePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="ic-btn stop" id="bs" onclick="stopRide()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
      </button>
      <button class="ic-btn hist vis" onclick="openHist()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      </button>
    </div>
  </div>

  <!-- GPS HELP -->
  <div id="gpsh">
    <div class="gh-ico">📍</div>
    <div class="gh-ttl">위치 권한이 필요해요</div>
    <div class="gh-msg">속도와 거리 측정을 위해<br>GPS 권한을 허용해 주세요.</div>
    <div class="gh-steps">
      <b>크롬 (Android)</b><br>
      주소창 왼쪽 🔒 → 위치 → 허용<br><br>
      <b>사파리 (iPhone)</b><br>
      설정 앱 → Safari → 위치 → 허용
    </div>
    <button class="gh-btn" onclick="document.getElementById('gpsh').classList.remove('on')">확인</button>
  </div>

  <!-- HISTORY SHEET -->
  <div id="hs">
    <div class="hs-handle"></div>
    <div class="hs-head">
      <span class="hs-ttl">라이딩 기록</span>
      <button class="hs-x" onclick="closeHist()">×</button>
    </div>
    <div class="hs-body" id="hb"></div>
  </div>
</div>

<script>
// STATE
const S={riding:false,paused:false,t0:null,pausedMs:0,pauseStart:null,dist:0,spd:0,maxSpd:0,lastPos:null,ticker:null,gpsOk:false,destName:'',destCoord:null};
let curLat=null,curLng=null,map=null,uMark=null,dMark=null,rLayer=null;
let memRides=[],userPanned=false;

// MAP
function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  map.setView([37.5665,126.978],15);
  uMark=L.marker([37.5665,126.978],{icon:L.divIcon({
    html:'<div style="width:16px;height:16px;background:#b8ff00;border:3.5px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(184,255,0,.2)"></div>',
    iconSize:[16,16],iconAnchor:[8,8],className:''
  })}).addTo(map);
  map.on('dragstart',()=>{ userPanned=true; });
  layout();
  window.addEventListener('resize',layout);
}
function layout(){
  const bh=document.getElementById('bot').offsetHeight;
  const rib=document.getElementById('ribbon');
  const rc=document.getElementById('btn-rc');
  rib.style.bottom=bh+'px';
  rc.style.bottom=(bh+12)+'px';
}

// GPS
function initGPS(){
  if(!navigator.geolocation){setGPS('GPS 미지원','err');return;}
  setGPS('검색중...','searching');
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
function setGPS(t,c){document.getElementById('gtxt').textContent=t;document.getElementById('gdot').className='dot '+c;}
function onPos(p){
  const{latitude:la,longitude:ln,speed:sp}=p.coords;
  curLat=la;curLng=ln;
  if(!S.gpsOk){S.gpsOk=true;setGPS('GPS 연결','ok');document.getElementById('gpsh').classList.remove('on');map.setView([la,ln],16);}
  if(uMark)uMark.setLatLng([la,ln]);
  if(!S.riding||S.paused)return;
  let kmh=0;
  if(sp!=null&&sp>=0)kmh=sp*3.6;
  else if(S.lastPos){const dt=(p.timestamp-S.lastPos.ts)/1000;if(dt>0){const d=hav(S.lastPos.la,S.lastPos.ln,la,ln);kmh=(d/1000)/(dt/3600);}}
  if(kmh>90)kmh=S.spd;
  S.spd=Math.round(kmh*10)/10;
  if(S.spd>S.maxSpd)S.maxSpd=S.spd;
  const el=document.getElementById('spd');
  el.textContent=Math.round(S.spd);
  el.className='sb-num'+(S.spd>1?' go':'');
  if(S.lastPos){const d=hav(S.lastPos.la,S.lastPos.ln,la,ln);if(d<150)S.dist+=d;}
  S.lastPos={la,ln,ts:p.timestamp};
  updStats();
  if(!userPanned)map.setView([la,ln],map.getZoom(),{animate:true,duration:.6});
  if(S.destCoord){const rem=hav(la,ln,S.destCoord.la,S.destCoord.ln)/1000;document.getElementById('rs').textContent='남은 거리 '+rem.toFixed(1)+'km';}
}
function onErr(){if(!S.gpsOk){setGPS('권한 없음','err');document.getElementById('gpsh').classList.add('on');}}
function hav(a1,b1,a2,b2){const R=6371000,dA=(a2-a1)*Math.PI/180,dB=(b2-b1)*Math.PI/180,x=Math.sin(dA/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dB/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

// RIDE
function handleMain(){if(!S.riding)startRide();}
function startRide(){
  S.riding=true;S.paused=false;S.t0=Date.now();S.pausedMs=0;S.dist=0;S.spd=0;S.maxSpd=0;S.lastPos=null;userPanned=false;
  document.getElementById('bg').textContent='라이딩 중...';document.getElementById('bg').disabled=true;
  document.getElementById('bp').classList.add('vis');document.getElementById('bs').classList.add('vis');
  S.ticker=setInterval(tick,1000);
}
function togglePause(){
  const b=document.getElementById('bp');
  if(!S.paused){
    S.paused=true;S.pauseStart=Date.now();S.spd=0;
    document.getElementById('spd').textContent='0';document.getElementById('spd').className='sb-num';
    b.classList.remove('paus');b.classList.add('paus');
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg>`;
    b.style.background='rgba(184,255,0,.12)';b.querySelector('svg').style.fill='#b8ff00';
  }else{
    S.paused=false;S.pausedMs+=Date.now()-S.pauseStart;
    b.style.background='';b.querySelector('svg').style.fill='';
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></svg>`;
  }
}
function stopRide(){
  if(!S.riding)return;
  const ms=rideMs(),dk=(S.dist/1000).toFixed(2);
  const avg=ms>8000?(parseFloat(dk)/(ms/3600000)).toFixed(1):'0.0';
  const ride={ts:Date.now(),date:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),dur:fmt(ms),dist:dk,avg,max:S.maxSpd.toFixed(1),cal:Math.round(parseFloat(dk)*35),dest:S.destName||null};
  saveRide(ride);
  S.riding=false;S.paused=false;clearInterval(S.ticker);S.spd=0;S.dist=0;
  document.getElementById('spd').textContent='0';document.getElementById('spd').className='sb-num';
  document.getElementById('tv').textContent='00:00';
  document.getElementById('sd').innerHTML='0.00<span class="sc-u">km</span>';
  document.getElementById('sa').innerHTML='0.0<span class="sc-u">km/h</span>';
  document.getElementById('sc').innerHTML='0<span class="sc-u">kcal</span>';
  document.getElementById('bg').textContent='라이딩 시작';document.getElementById('bg').disabled=false;
  document.getElementById('bp').classList.remove('vis');document.getElementById('bs').classList.remove('vis');
}
function rideMs(){if(!S.t0)return 0;let p=S.pausedMs;if(S.paused&&S.pauseStart)p+=Date.now()-S.pauseStart;return Date.now()-S.t0-p;}
function tick(){if(!S.riding||S.paused)return;document.getElementById('tv').textContent=fmt(rideMs());}
function updStats(){const dk=S.dist/1000,ms=rideMs(),avg=ms>8000?(dk/(ms/3600000)).toFixed(1):'0.0';document.getElementById('sd').innerHTML=dk.toFixed(2)+'<span class="sc-u">km</span>';document.getElementById('sa').innerHTML=avg+'<span class="sc-u">km/h</span>';document.getElementById('sc').innerHTML=Math.round(dk*35)+'<span class="sc-u">kcal</span>';}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h>0?h+':'+pad(m%60)+':'+pad(s%60):pad(m)+':'+pad(s%60);}
function pad(n){return String(n).padStart(2,'0');}

// MAP
function recenter(){if(curLat&&map){userPanned=false;map.setView([curLat,curLng],16,{animate:true});}}

// SEARCH
async function doSearch(){
  const q=document.getElementById('si').value.trim();if(!q)return;
  const el=document.getElementById('sr');
  el.innerHTML='<div class="sri"><div class="sri-n">검색 중...</div></div>';el.classList.add('on');
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=ko`);
    const d=await r.json();
    if(!d.length){el.innerHTML='<div class="sri"><div class="sri-n">결과가 없어요</div></div>';return;}
    el.innerHTML=d.map(p=>`<div class="sri" onclick='pick(${p.lat},${p.lon},${JSON.stringify(p.display_name)})'><div class="sri-n">${p.display_name.split(',')[0]}</div><div class="sri-a">${p.display_name.split(',').slice(1,3).join(', ')}</div></div>`).join('');
  }catch(e){el.innerHTML='<div class="sri"><div class="sri-n">검색 실패. 인터넷을 확인해주세요.</div></div>';}
}
function pick(la,ln,name){
  document.getElementById('sr').classList.remove('on');
  const sh=name.split(',')[0];document.getElementById('si').value=sh;
  S.destName=sh;S.destCoord={la:parseFloat(la),ln:parseFloat(ln)};
  if(dMark)map.removeLayer(dMark);
  dMark=L.marker([la,ln],{icon:L.divIcon({html:'<div style="width:14px;height:14px;background:#ff4f4f;border:3.5px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(255,79,79,.2)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''})}).addTo(map).bindPopup(sh).openPopup();
  const pts=[[parseFloat(la),parseFloat(ln)]];if(curLat)pts.push([curLat,curLng]);
  map.fitBounds(pts,{padding:[70,70]});
  document.getElementById('ribbon').classList.add('on');
  document.getElementById('rd').textContent=sh;document.getElementById('rs').textContent='경로 계산 중...';
  document.getElementById('rv-d').textContent='—';document.getElementById('rv-t').textContent='—';
  layout();
  getRoute(curLat||parseFloat(la)-.01,curLng||parseFloat(ln)-.01,parseFloat(la),parseFloat(ln));
}
async function getRoute(la1,ln1,la2,ln2){
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/cycling/${ln1},${la1};${ln2},${la2}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.routes&&d.routes.length){
      const rt=d.routes[0];
      document.getElementById('rv-d').textContent=(rt.distance/1000).toFixed(1);
      document.getElementById('rv-t').textContent=Math.round(rt.duration/60);
      document.getElementById('rs').textContent='자전거 경로 안내 준비됨';
      if(rLayer)map.removeLayer(rLayer);
      rLayer=L.geoJSON(rt.geometry,{style:{color:'#b8ff00',weight:5.5,opacity:.88}}).addTo(map);
    }
  }catch(e){document.getElementById('rs').textContent='경로를 불러올 수 없어요';}
}
function clearRoute(){
  S.destName='';S.destCoord=null;
  document.getElementById('ribbon').classList.remove('on');document.getElementById('si').value='';
  if(dMark){map.removeLayer(dMark);dMark=null;}if(rLayer){map.removeLayer(rLayer);rLayer=null;}
  layout();
}

// HISTORY
function openHist(){loadHist();document.getElementById('hs').classList.add('open');}
function closeHist(){document.getElementById('hs').classList.remove('open');}
async function saveRide(r){try{await window.storage.set('ride:'+r.ts,JSON.stringify(r));}catch(e){memRides.unshift(r);}}
async function getRides(){
  let rides=[];
  try{const res=await window.storage.list('ride:');if(res&&res.keys&&res.keys.length){for(const k of res.keys){try{const r=await window.storage.get(k);if(r)rides.push(JSON.parse(r.value));}catch(e){}}}
  }catch(e){rides=[...memRides];}
  return rides.sort((a,b)=>b.ts-a.ts);
}
async function loadHist(){
  const rides=await getRides();const b=document.getElementById('hb');
  if(!rides.length){b.innerHTML='<div class="empty"><div class="ei">🚴</div><div class="et">아직 기록이 없어요.<br>첫 라이딩을 시작해보세요!</div></div>';return;}
  b.innerHTML=rides.map(r=>`<div class="rc"><div class="rc-top"><div><div class="rc-date">${r.date}</div>${r.dest?`<div class="rc-dest">📍 ${r.dest}</div>`:''}</div><div class="rc-dur">${r.dur}</div></div><div class="rc-st"><div><div class="rst-l">거리</div><div class="rst-v">${r.dist}<span class="rst-u">km</span></div></div><div><div class="rst-l">평균속도</div><div class="rst-v">${r.avg}<span class="rst-u">km/h</span></div></div><div><div class="rst-l">칼로리</div><div class="rst-v">${r.cal}<span class="rst-u">kcal</span></div></div></div></div>`).join('');
}

// EVENTS
document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
document.addEventListener('click',e=>{
  if(!e.target.closest('#top'))document.getElementById('sr').classList.remove('on');
});

// INIT
initMap();
initGPS();
</script>
</body>
